# cuevik-start step registry. Execution metadata only; references/runner.md is the workflow and
# each step's skills/<id>/SKILL.md is its content contract.
#
# Not here, on purpose: upstream documents, owner and reviewers. Those live in the project's
# .cuevik/lineage.json (contract: contracts/lineage/). The runner reads them from there:
#   - a step's upstream inputs = the `upstream` of its primary output (the first `outputs` entry)
#   - its owner and reviewers  = that same document's `owner` and `reviewers`
#
# Fields:
#   id                  step id = skill name (/cuevik-start:<id>); order in this list is run order
#   title               human title
#   bootstrap           true only for 00-bootstrap: runs before .cuevik/ exists, so it has no
#                       lineage, gate or upstream checks (runner §1)
#   branch              working branch, always init/<id>
#   outputs             files the step writes; the first is the primary output
#   conditionalOutputs  true when some outputs are written only if the step's skill says so
#   template            file in the step's own folder, skills/<id>/, that owns the primary output's
#                       structure (shared parts: references/_writing-rules.md, _doc-references.md)
#   replacesExisting    true when the primary output is expected on main already (runner §1.6)
#   storyPriority,      Priority and Size option names 00-bootstrap sets on this step's initiation
#   storySize           story, when the board has those fields and options (bootstrap §E.4)
#   storyEfforts        hours 00-bootstrap writes to the story's Efforts field, by size and complexity
#   aliases             legacy ids of a renamed step. Merged PRs sit on the old init/<alias> branches and
#                       cannot be renamed, so status and runner §1 check 4 look a step's PR up under its
#                       branch and under each alias branch. Nothing else reads aliases
#   commitMessage, prSummary, finalReminder, specialPreconditions, specialActions: as named

steps:
  - id: 00-bootstrap
    title: Bootstrap
    bootstrap: true
    branch: init/00-bootstrap
    outputs:
      - CONTRIBUTING.md
      - .cuevik/config.json
      - .cuevik/lineage.json
      - .markdownlint.json
    commitMessage: "docs: add repo governance baseline and .cuevik config (00-bootstrap)"
    prSummary: "Summarize the branching + self-review governance, the repo connected or created, the project board state (connected or created, or why there is none), the initiation issues filed, and the repo settings changed."
    finalReminder: "Repo governance becomes final only when the Architect merges the PR (self-review checklist complete). Then run /cuevik-start:01-product-concept in a new session."
    specialPreconditions:
      - "gh is authenticated with the repo scope, plus the project scope for a board; without it, or in a cloud session (which cannot reach Projects v2), bootstrap goes on without a board."
    specialActions:
      - "Make the current folder a git repo if it is not one, and connect or create the GitHub repo as origin (skills/00-bootstrap/SKILL.md §B). List and confirm every create first."
      - "Optionally connect or create and link the project board (references/board-adapter.md); a board failure never stops bootstrap. Record boardState in .cuevik/config.json, with the board's ids read back (project) and any incomplete parts (missing) as that state requires."
      - "File the initiation issues (label initiation only): an Initiation epic and one story per later step, as sub-issues of the epic, and on the board when there is one. Record their numbers in .cuevik/config.json."
      - "When a board is recorded, check its seven workflows are on and guide the operator to turn on any that are off, including Auto-add to project with this repo in its filter (no API can)."
      - "Write .cuevik/lineage.json with the default lineage."
      - "Write .markdownlint.json at the repo root (default rules, MD013 off, MD024 siblings_only) so _writing-rules' lint rule has a config to run against."
      - "Turn on the repo's auto-delete head branches setting."
      - "Write the governance layer of CONTRIBUTING.md, with the initiation-only rules inside the INITIATION-ONLY fence. Do not add stack-specific commands yet."
      - "Never copy plugin machinery (runner, registry, templates, roles) into the repo."

  - id: 01-product-concept
    title: Product Concept
    storyPriority: High
    storySize: SM
    storyEfforts: 4
    branch: init/01-product-concept
    outputs:
      - docs/PRODUCT.md
    template: PRODUCT.template.md
    commitMessage: "docs: add PRODUCT.md (01-product-concept)"
    prSummary: "Summarize the product concept decisions and include the 01-product-concept reviewer checklist."
    finalReminder: "PRODUCT.md becomes final only when the Product Owner approves and merges the PR."
    specialPreconditions:
      - "The superpowers plugin (superpowers@claude-plugins-official) is installed and enabled: the interview runs its brainstorming skill (skills/01-product-concept/SKILL.md, Precondition)."
    specialActions:
      - "When the repo has a board (boardState not none), set the board's short description to a one-line distillation of the PRODUCT.md Objective and its README to the PRODUCT.md Description verbatim, via board-adapter board.setMeta (skills/01-product-concept/SKILL.md, Board metadata). A failed board call never stops the step; report it in the PR body."

  - id: 02-product-requirements
    title: Product Requirements Document
    storyPriority: High
    storySize: LG
    storyEfforts: 12
    branch: init/02-product-requirements
    outputs:
      - docs/PRD.md
    template: PRD.template.md
    commitMessage: "docs: add PRD.md (02-product-requirements)"
    prSummary: "Summarize the requirements and include the 02-product-requirements reviewer checklist."
    finalReminder: "PRD.md becomes final only when the Product Owner approves and merges the PR."
    specialPreconditions:
      - "The superpowers plugin (superpowers@claude-plugins-official) is installed and enabled: the interview runs its brainstorming skill (skills/02-product-requirements/SKILL.md, Precondition)."

  - id: 03-architecture
    title: Architecture
    storyPriority: High
    storySize: LG
    storyEfforts: 12
    branch: init/03-architecture
    outputs:
      - docs/ARCHITECTURE.md
    template: ARCHITECTURE.template.md
    commitMessage: "docs: add ARCHITECTURE.md (03-architecture)"
    prSummary: "Summarize the design decisions and include the 03-architecture reviewer checklist."
    finalReminder: "ARCHITECTURE.md becomes final only when the Architect and Product Owner approve and merge the PR."

  - id: 04-tech-stack
    title: Tech Stack
    storyPriority: High
    storySize: MD
    storyEfforts: 6
    branch: init/04-tech-stack
    outputs:
      - docs/TECH-STACK.md
      - CONTRIBUTING.md
    template: TECH-STACK.template.md
    commitMessage: "docs: add TECH-STACK.md and CONTRIBUTING tooling layer (04-tech-stack)"
    prSummary: "Summarize the stack choices, the tooling commands added, and include the 04-tech-stack reviewer checklist."
    finalReminder: "TECH-STACK.md and the CONTRIBUTING.md tooling layer become final only when the Architect approves and merges the PR."
    specialActions:
      - "Append the tooling layer to CONTRIBUTING.md, between TOOLING-LAYER markers, using only technologies approved in TECH-STACK.md. Preserve the 00-bootstrap governance layer."

  - id: 05-test-strategy
    title: Test Strategy
    storyPriority: High
    storySize: MD
    storyEfforts: 6
    branch: init/05-test-strategy
    outputs:
      - docs/TEST-STRATEGY.md
    template: TEST-STRATEGY.template.md
    commitMessage: "docs: add TEST-STRATEGY.md (05-test-strategy)"
    prSummary: "Summarize the test levels, the coverage target and how each NFR is verified, and include the 05-test-strategy reviewer checklist."
    finalReminder: "TEST-STRATEGY.md becomes final only when the Architect and Product Owner approve and merge the PR."

  - id: 06-ai-tool-guide
    title: AI Tool Guide
    aliases: [05-ai-tool-guide]
    storyPriority: High
    storySize: MD
    storyEfforts: 6
    branch: init/06-ai-tool-guide
    outputs:
      - docs/AI-TOOL-GUIDE.md
      - CLAUDE.md
      - .github/copilot-instructions.md
      - .claude/settings.json
    conditionalOutputs: true
    template: AI-TOOL-GUIDE.template.md
    commitMessage: "docs: add AI-TOOL-GUIDE.md and tool adapters (06-ai-tool-guide)"
    prSummary: "Summarize the AI rules, list the generated adapter files, and include the 06-ai-tool-guide reviewer checklist."
    finalReminder: "AI-TOOL-GUIDE.md and generated adapter files become final only when the Architect approves and merges the PR."
    specialActions:
      - "Ask which AI tools the team will use before generating adapters."
      - "Generate AI-TOOL-GUIDE.md always."
      - "Generate only the adapter files required for the selected tools."
      - "Keep shared rules in AI-TOOL-GUIDE.md; adapters contain only tool-specific config."
      - "Generate .github/copilot-instructions.md as the project's own Copilot rules only. The cuevik-start runner stays in the plugin and is never copied into the repo."
      - "When Claude Code is selected, write the team's plugins to .claude/settings.json (extraKnownMarketplaces + enabledPlugins), chosen with the operator; list manual prerequisites such as graphify in the guide."

  - id: 07-readme
    title: README
    aliases: [06-readme]
    storyPriority: High
    storySize: SM
    storyEfforts: 3
    branch: init/07-readme
    outputs:
      - README.md
    replacesExisting: true
    template: README.template.md
    commitMessage: "docs: replace boilerplate README with project README (07-readme)"
    prSummary: "Note that the boilerplate README is replaced and include the 07-readme reviewer checklist."
    finalReminder: "README.md becomes final only when the Architect approves and merges the PR. Initiation is complete only after 09-finalize is merged."
    specialActions:
      - "Replace the repo's current README with the generated project README."
      - "Remove any leftover placeholder or boilerplate content from README.md."
      - "Scaffolded mode (application code on main): test every command included in README.md before committing. Docs-first mode: show pointers only for versions and commands, and mark Environment Setup Pending scaffold — unverified instead (skills/07-readme/SKILL.md, No duplication and Mode)."

  - id: 08-backlog
    title: Initial Backlog
    aliases: [07-backlog]
    storyPriority: High
    storySize: MD
    storyEfforts: 8
    branch: init/08-backlog
    outputs:
      - docs/BACKLOG.md
    template: BACKLOG.template.md
    commitMessage: "docs: add BACKLOG.md (08-backlog)"
    prSummary: "State the epic count, story count, priority breakdown, and include the 08-backlog reviewer checklist."
    finalReminder: "BACKLOG.md becomes final only when the Product Owner approves and merges the PR. Once merged, run /cuevik-start:09-finalize in a new session to finalize CONTRIBUTING.md."
    specialActions:
      - "Derive epics and stories from PRODUCT.md and PRD.md before creating GitHub issues."
      - "Present the derived backlog and wait for approval before any GitHub or file writes."
      - "Create GitHub issues one at a time with gh and capture their numbers."

  - id: 09-finalize
    title: Finalize Governance
    aliases: [08-finalize]
    storyPriority: High
    storySize: XS
    storyEfforts: 1
    branch: init/09-finalize
    outputs:
      - CONTRIBUTING.md
    replacesExisting: true    # CONTRIBUTING.md is already on main; this step transforms it
    commitMessage: "docs: finalize CONTRIBUTING.md for the development phase (09-finalize)"
    prSummary: "State that the init-only governance block was removed, the permanent core and tooling layer were preserved, and the development-phase stub was left for the team; include the advisory cuevik-docs:audit findings (read-only) and the 09-finalize reviewer checklist."
    finalReminder: "CONTRIBUTING.md becomes final for the development phase only when the Architect merges the PR. Initiation is complete once this is merged; run /cuevik-start:cleanup afterward."
    specialActions:
      - "Read CONTRIBUTING.md from main."
      - "Remove only the fenced INITIATION-ONLY block (markers included). Preserve the permanent governance rules and the entire 04-tech-stack tooling layer verbatim."
      - "Insert the DEVELOPMENT-PHASE-GOVERNANCE stub from the step's skill where the removed block was."
      - "If the INITIATION-ONLY markers are absent from CONTRIBUTING.md on main, STOP. Do not delete lines by inference."
      - "Do not author a full development-phase policy; leave the stub for the team to expand via /cuevik-docs:update."
      - "Invoke cuevik-docs:audit only, read-only (never fix), over the full doc set after the CONTRIBUTING.md approval; report findings in the PR body. Advisory: never a gate, and it changes no file."
